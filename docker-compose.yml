services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/data
    depends_on:
      - admin

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - db_data:/data

volumes:
  db_data:
