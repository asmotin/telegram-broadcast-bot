<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Broadcast Admin{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-header">
      <span class="logo">📢 Broadcast</span>
    </div>
    <ul class="nav-links">
      <li><a href="/" class="{% if request.url.path == '/' %}active{% endif %}">🏠 Главная</a></li>
      <li><a href="/groups" class="{% if '/groups' in request.url.path %}active{% endif %}">👥 Группы</a></li>
      <li><a href="/labels" class="{% if '/labels' in request.url.path %}active{% endif %}">🏷 Ярлыки</a></li>
      <li><a href="/broadcasts" class="{% if '/broadcasts' in request.url.path %}active{% endif %}">📨 Рассылки</a></li>
      <li><a href="/admins" class="{% if '/admins' in request.url.path %}active{% endif %}">🔑 Администраторы</a></li>
    </ul>
    <div class="sidebar-footer">
      <form method="post" action="/logout">
        <button type="submit" class="logout-btn">🚪 Выйти</button>
      </form>
    </div>
  </nav>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
